<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    <!-- DNS prefetch for faster resolution -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <!-- Inline critical CSS for instant render -->
    <style>
      *,
      ::after,
      ::before {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        font-size: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background: #f8fafc;
        color: #0f172a;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
      }
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }
      .logo {
        height: 2.5rem;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        display: block;
      }
    </style>
    <style>
      .shell-nav {
        position: sticky;
        top: 0;
        z-index: 100;
        height: 4.5rem;
        display: flex;
        align-items: center;
        background: #fff;
        box-shadow:
          0 1px 3px 0 rgb(0 0 0/0.1),
          0 1px 2px -1px rgb(0 0 0/0.1);
      }
      .shell-nav-inner {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .shell-logo {
        height: 3.5rem;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        display: block;
      }
      @media (min-width: 768px) {
        .shell-nav-inner {
          padding: 0 1.5rem;
        }
      }
      @media (min-width: 1024px) {
        .shell-nav-inner {
          padding: 0 2rem;
        }
      }
      /* Critical hero shell for faster LCP. Mirrors the real React hero's
         box model (spacing, font sizes, container, CTA footprint) so the
         swap on mount causes no visible layout shift (low CLS). Values are
         the literal equivalents of the design tokens the hero uses. */
      .shell-hero {
        min-height: 90vh;
        display: flex;
        align-items: center;
        background: linear-gradient(
          160deg,
          #f8fafc 0%,
          #fff 60%,
          #eff6ff 100%
        );
      }
      .shell-hero-container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 4rem 1rem; /* --space-16 --container-padding */
      }
      .shell-hero-content {
        max-width: 720px;
      }
      .shell-headline {
        font-size: clamp(2.5rem, 5.5vw, 3rem); /* matches --fs-4xl */
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.03em;
        color: #0f172a;
        margin-bottom: 1.5rem; /* --space-6 */
      }
      .shell-tagline {
        font-size: clamp(1.125rem, 2.5vw, 1.5rem); /* --fs-md .. --fs-xl */
        font-weight: 500;
        line-height: 1.6;
        color: #475569;
        max-width: 56ch;
        margin-bottom: 3rem; /* --space-12: reserves space for CTA row */
      }
      .shell-gradient {
        background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: #2563eb; /* fallback before gradient clip applies */
      }
      /* Placeholder CTA row: same footprint as the real buttons so the
         vertical box height matches and nothing jumps on mount. */
      .shell-cta {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem; /* --space-4 */
      }
      .shell-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 2rem; /* --space-3 --space-8 */
        min-height: 44px;
        border-radius: 1rem; /* --radius-xl */
        font-size: 1rem; /* --fs-base */
        font-weight: 600;
        line-height: 1.25;
        border: 2px solid transparent;
        text-decoration: none;
        white-space: nowrap;
      }
      .shell-btn-primary {
        background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
        color: #fff;
      }
      .shell-btn-secondary {
        background: transparent;
        color: #2563eb;
        border-color: #3b82f6;
      }
      @media (min-width: 768px) {
        .shell-hero-container {
          padding: 4rem 1.5rem; /* --container-padding grows at md */
        }
      }
      @media (min-width: 1024px) {
        .shell-hero-container {
          padding: 4rem 2rem; /* --container-padding grows at lg */
        }
      }
      @media (max-width: 767px) {
        .shell-hero-content {
          text-align: center;
        }
        .shell-cta {
          justify-content: center;
        }
      }
    </style>
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="%BASE_URL%logo-200.webp"
      imagesrcset="%BASE_URL%logo-100.webp 100w, %BASE_URL%logo-200.webp 200w"
      imagesizes="(max-width: 768px) 100px, 200px"
    />
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    />
    <meta
      name="description"
      content="JobList.am - Armenia's two-sided job marketplace connecting talented professionals with top employers. Browse jobs, apply with ease, and track your applications."
    />
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="JobList.am - Connect Talent with Opportunity"
    />
    <meta
      property="og:description"
      content="Armenia's job marketplace for candidates and employers. Browse open positions, apply instantly, and manage your hiring pipeline."
    />
    <meta property="og:site_name" content="JobList.am" />
    <meta property="og:url" content="https://joblist-am.vercel.app" />
    <meta property="og:image" content="%BASE_URL%preview.webp" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="JobList.am - Connect Talent with Opportunity"
    />
    <meta
      name="twitter:description"
      content="Armenia's job marketplace for candidates and employers."
    />
    <meta name="twitter:image" content="%BASE_URL%preview.webp" />
    <link rel="apple-touch-icon" href="%BASE_URL%logo192.webp" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>JobList.am - Connect Talent with Opportunity</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <header class="shell-nav">
        <div class="shell-nav-inner">
          <a href="/" aria-label="JobList.am home">
            <img
              class="shell-logo"
              src="%BASE_URL%logo-200.webp"
              srcset="
                %BASE_URL%logo-100.webp 100w,
                %BASE_URL%logo-200.webp 200w
              "
              sizes="(max-width: 768px) 100px, 200px"
              alt="JobList.am"
              width="100"
              height="100"
              fetchpriority="high"
              decoding="async"
            />
          </a>
        </div>
      </header>
      <!-- Critical hero shell for fast LCP. React (createRoot) replaces #root
           on mount; this shell mirrors the real hero's box model so there is
           no layout shift when it does. -->
      <main class="shell-hero">
        <div class="shell-hero-container">
          <div class="shell-hero-content">
            <h1 class="shell-headline">Find Your Next Career Move</h1>
            <p class="shell-tagline">
              Armenia's job platform for <span class="shell-gradient">ambitious professionals</span> and <span class="shell-gradient">growing companies</span>
            </p>
            <div class="shell-cta" aria-hidden="true">
              <span class="shell-btn shell-btn-primary">Browse Jobs</span>
              <span class="shell-btn shell-btn-secondary">Post a Job</span>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
