<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    <!-- DNS prefetch for faster resolution -->
    <link rel="dns-prefetch" href="https://lhyygqlwwttmqghdrvlh.supabase.co" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <!-- Inline critical CSS for instant render -->
    <style>
      *,
      ::after,
      ::before {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        font-size: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background: #f8fafc;
        color: #0f172a;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
      }
      img {
        max-width: 100%;
        height: auto;
        display: block;
      }
      .logo {
        height: 2.5rem;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        display: block;
      }
    </style>
    <style>
      .shell-nav {
        position: sticky;
        top: 0;
        z-index: 100;
        height: 4.5rem;
        display: flex;
        align-items: center;
        background: #fff;
        box-shadow:
          0 1px 3px 0 rgb(0 0 0/0.1),
          0 1px 2px -1px rgb(0 0 0/0.1);
      }
      .shell-nav-inner {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .shell-logo {
        height: 3.5rem;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        display: block;
      }
      @media (min-width: 768px) {
        .shell-nav-inner {
          padding: 0 1.5rem;
        }
      }
      @media (min-width: 1024px) {
        .shell-nav-inner {
          padding: 0 2rem;
        }
      }
    </style>
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="%PUBLIC_URL%/logo-200.webp"
      imagesrcset="%PUBLIC_URL%/logo-100.webp 100w, %PUBLIC_URL%/logo-200.webp 200w"
      imagesizes="(max-width: 768px) 100px, 200px"
    />
    <!-- Preconnect to external resources -->
    <link
      rel="preconnect"
      href="https://lhyygqlwwttmqghdrvlh.supabase.co"
      crossorigin
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Async load Google Fonts -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      as="style"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    /></noscript>
    <meta
      name="description"
      content="JobList.am - Armenia's two-sided job marketplace connecting talented professionals with top employers. Browse jobs, apply with ease, and track your applications."
    />
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="JobList.am - Connect Talent with Opportunity"
    />
    <meta
      property="og:description"
      content="Armenia's job marketplace for candidates and employers. Browse open positions, apply instantly, and manage your hiring pipeline."
    />
    <meta property="og:site_name" content="JobList.am" />
    <meta property="og:url" content="https://joblist-am.vercel.app" />
    <meta property="og:image" content="%PUBLIC_URL%/preview.webp" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="JobList.am - Connect Talent with Opportunity"
    />
    <meta
      name="twitter:description"
      content="Armenia's job marketplace for candidates and employers."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/preview.webp" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.webp" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>JobList.am - Connect Talent with Opportunity</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="shell-nav" aria-hidden="true">
        <div class="shell-nav-inner">
          <img
            class="shell-logo"
            src="%PUBLIC_URL%/logo-200.webp"
            srcset="
              %PUBLIC_URL%/logo-100.webp 100w,
              %PUBLIC_URL%/logo-200.webp 200w
            "
            sizes="(max-width: 768px) 100px, 200px"
            alt=""
            width="100"
            height="100"
            fetchpriority="high"
            decoding="async"
          />
        </div>
      </div>
    </div>
  </body>
</html>
